<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reuma-evidens</title>
<!-- Bump ?v= when the stylesheet changes: GitHub Pages caches assets, so
     without it a deploy can leave visitors on the previous CSS. -->
<link rel="stylesheet" href="assets/style.css?v=20">
<!-- Optional live-write layer (see the firebaseConfig comment in the script
     below) -- safe to load even before a real project is configured. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check-compat.js"></script>
</head>
<body class="salix">
<header class="site-header">
  <div class="brand">
    <span class="wordmark">Reuma-<em>evidens</em></span>
  </div>
  <span class="header-right">
    <span id="auth-banner"></span>
    <span id="star-banner"></span>
    <span id="flag-banner"></span>
    <span id="edit-banner"></span>
    <span id="updated-date"></span>
  </span>
</header>

<div id="app">
  <div id="evidence-tabs" class="tabs-col"></div>
  <div id="viewer">
    <div id="disease-tabs" class="tabs-row"></div>
    <div id="tier-filter" class="tier-filter"></div>
    <div id="panel"></div>
  </div>
</div>

<footer class="site-footer">Genereret automatisk fra PubMed. Opdateres ugentligt.</footer>

<script>
// Display order only. Classification precedence is DISEASE_PATTERNS in
// update_library.py and is deliberately different — don't sync the two.
const DISEASE_ORDER = ["RA","PsA/SpA","PMR/GCA","Crystal","General","SLE","IIM","Vasculitis","Sjögren","SSc","Autoinflammatory"];
// A viewer-only pseudo-group shown first and selected by default: never a
// stored label, so it stays out of DISEASE_ORDER and out of the digests.
const ALL_GROUP = "__all__";
const DISEASE_LABEL = {
  "RA": "RA", "PsA/SpA": "PsA/SpA", "SLE": "SLE", "IIM": "IIM",
  "Vasculitis": "Vaskulitis", "PMR/GCA": "PMR og GCA", "Sjögren": "Sjögren", "SSc": "SSc",
  "Crystal": "Krystalartrit", "Autoinflammatory": "Autoinflammatorisk", "General": "Generelt",
  [ALL_GROUP]: "Alle"
};
const EVIDENCE_ORDER = ["RCT","Guideline/consensus","Evidence synthesis","Observational","Clinical case/survey"];
// Viewer-only, like ALL_GROUP: never a stored evidence_type.
const ALL_EVIDENCE = "__all_ev__";
const EVIDENCE_LABEL = {
  [ALL_EVIDENCE]: "Alt",
  "RCT": "RCT", "Guideline/consensus": "Retningslinje",
  "Evidence synthesis": "Meta/reviews", "Observational": "Observationelt",
  "Clinical case/survey": "Klinisk case/opgørelse"
};
const EVIDENCE_BADGE = {
  "RCT": "RCT", "Guideline/consensus": "Retningslinje",
  "Evidence synthesis": "Meta/review", "Observational": "Observationel",
  "Clinical case/survey": "Case"
};
const MONTHS_DA = ["januar","februar","marts","april","maj","juni",
                   "juli","august","september","oktober","november","december"];

const TIERS = [1, 2, 3, 4];
// What the tiers actually mean, in the reader's words. Stored as 1-4 so the
// data stays language-neutral; only the viewer names them.
const TIER_LABEL = {
  1: "Top medicin", 2: "Top reumatologi", 3: "Reumatologi", 4: "Øvrige"
};

// Declared before the live-write layer below on purpose: onAuthStateChanged
// can fire synchronously while the SDK is still being set up (a restored
// session does exactly that), and its callback reads rawLibrary. Left further
// down, that read lands in the temporal dead zone and takes the page with it.
let rawLibrary = [];
let library = [];
let hiddenLibrary = [];
let onlyEdited = false;

// ---------- Live-write layer (Firestore) ----------
// The whole correction mechanism: a signed-in edit (hide, reclassify,
// dismiss a flag) writes straight to a small Firestore collection and shows
// up immediately, for every visitor. This is the only way a correction
// reaches the site -- there is no batch path behind it.
// Who may write is enforced server-side by firestore.rules, not here --
// these values are meant to be public (that's how Firebase web configs
// work), so there's no secret to protect in this file.
// storageBucket is deliberately omitted -- this page uses only Auth and
// Firestore, neither of which reads it.
const firebaseConfig = {
  apiKey: "AIzaSyBYp1_uLGISdwrDn1KcWyU5hGlzwzfmhn4",
  authDomain: "rheum-digest.firebaseapp.com",
  projectId: "rheum-digest",
  messagingSenderId: "983893773853",
  appId: "1:983893773853:web:1bbe114318ee7c158440f4"
};
// Two ways this can be unavailable: no real project configured, or the SDK
// didn't load at all -- a blocked CDN, an ad-blocker, a flaky network. The
// second must not take the whole page down with it: without this guard the
// reference below throws and nothing renders, library and all. Either way
// the page still reads fine; it just can't be corrected, so the controls
// that would do so aren't drawn (see renderItem).
const FIREBASE_AVAILABLE = firebaseConfig.apiKey !== "REPLACE_ME"
  && typeof firebase !== "undefined";
// Only one person signs in at all: the owner, to review what everyone else
// changed. Identified by Firebase UID rather than address, deliberately --
// this file and firestore.rules are both public, and a UID is opaque where a
// personal address wouldn't be. Not a secret either way; the rules are what
// actually enforce it.
const OWNER_UID = "QCjUBL8iihh6ZnbZmFhpiZ6dOwM2";
function emailOf(user) { return ((user && user.email) || "").toLowerCase(); }
function isOwner() { return !!currentUser && currentUser.uid === OWNER_UID; }

// Bot protection stands in for the login colleagues no longer have: App Check
// attests that a request came from this page rather than a script hitting the
// API directly. Get the key from the reCAPTCHA console, register it under App
// Check in the Firebase console, then enforce it there. Left unset the page
// works exactly as it does now -- App Check simply isn't attached.
const RECAPTCHA_SITE_KEY = "REPLACE_ME";
let auth = null, db = null, currentUser = null;
// pmid -> {hidden?, dismissed_flag?, disease_groups?, evidence_type?}
let overridesMap = new Map();

if (FIREBASE_AVAILABLE) {
  firebase.initializeApp(firebaseConfig);
  if (RECAPTCHA_SITE_KEY !== "REPLACE_ME" && firebase.appCheck) {
    // Second argument keeps the token refreshed for the life of the page.
    firebase.appCheck().activate(RECAPTCHA_SITE_KEY, true);
  }
  auth = firebase.auth();
  db = firebase.firestore();
  // Signing in or out changes whether a card offers the owner's controls,
  // so the cards are repainted too -- but only once there's something to
  // paint, since this fires before the library has loaded.
  auth.onAuthStateChanged(user => {
    currentUser = user;
    renderAuthBanner();
    if (rawLibrary.length) refresh();
  });
}

function renderAuthBanner() {
  const el = document.getElementById("auth-banner");
  if (!el || !FIREBASE_AVAILABLE) return;
  // .banner-long is dropped on a phone (see style.css) so the header stays
  // one line instead of wrapping into 130px of sticky chrome.
  el.innerHTML = currentUser
    ? `<button class="auth-banner-btn" onclick="signOutUser()"><span class="banner-long">${emailOf(currentUser)} · </span>Log ud</button>`
    : `<button class="auth-banner-btn" onclick="signIn()">Log ind</button>`;
}

// Only the owner ever signs in, and only to review. Everyone else edits
// without an account at all -- see applyOverride. Google rather than an
// email link because hospital mail silently swallowed the links: Firebase
// sends from a firebaseapp.com address with no SPF or DKIM alignment, which
// is exactly what a hospital filter quarantines, and the quarantine isn't
// reachable from the account either.
function signIn() {
  return auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => {
    console.error(err);
    alert("Login mislykkedes: " + err.message);
  });
}

function signOutUser() { auth.signOut(); }

function loadOverrides() {
  if (!FIREBASE_AVAILABLE) return Promise.resolve();
  return db.collection("overrides").get().then(snap => {
    overridesMap = new Map(snap.docs.map(d => [d.id, d.data()]));
  }).catch(err => console.error("Kunne ikke hente rettelser fra Firestore", err));
}

// Applied on top of the fetched records, never in place -- rawLibrary stays
// the untouched fetch so a new override can be re-applied without refetching.
// Hidden records go to their own list rather than being dropped: an edit made
// by a colleague has to stay reachable, or a wrongly hidden article would be
// invisible to the one person who can bring it back.
function applyOverrides(records) {
  library = [];
  hiddenLibrary = [];
  records.forEach(r => {
    const o = overridesMap.get(r.pmid);
    if (!o) { library.push(r); return; }
    const merged = { ...r, __ov: o };
    if (o.dismissed_flag) delete merged.flagged;
    if (o.disease_groups) merged.disease_groups = o.disease_groups;
    if (o.evidence_type) merged.evidence_type = o.evidence_type;
    (o.hidden ? hiddenLibrary : library).push(merged);
  });
}

// An edit is "unreviewed" until the owner acknowledges it -- that's what the
// "✎ N rettet" badge counts. Hidden ones are included, since those are
// exactly the edits you can't see any other way.
function editedRecords() {
  return [...library, ...hiddenLibrary]
    .filter(r => r.__ov && !r.__ov.acknowledged)
    .sort((a, b) => (overrideTime(b.__ov) - overrideTime(a.__ov)));
}

function overrideTime(o) {
  const t = o && o.updated_at;
  if (!t) return 0;
  const d = t.toDate ? t.toDate() : new Date(t);
  return isNaN(d) ? 0 : d.getTime();
}

function overrideDate(o) {
  const ms = overrideTime(o);
  if (!ms) return "";
  return new Date(ms).toLocaleDateString("da-DK", { day: "numeric", month: "short" });
}

let activeDisease = null;
let activeEvidence = null;
let onlyFlagged = false;

// Personal bookmarks, kept in this browser only -- there's no server to save
// them to (see the correction-form comment on why the site can't write back
// to GitHub itself). localStorage.getItem can throw in a locked-down context
// (private browsing in some browsers); starring is a nice-to-have, so fail
// quiet and just start empty rather than breaking the page over it.
const STAR_STORAGE_KEY = "reuma-evidens-starred";
let starredSet = new Set();
try {
  starredSet = new Set(JSON.parse(localStorage.getItem(STAR_STORAGE_KEY) || "[]"));
} catch (e) { /* starting empty is fine */ }
let onlyStarred = false;

function isStarred(rec) { return starredSet.has(rec.pmid); }

function toggleStar(pmid) {
  if (starredSet.has(pmid)) starredSet.delete(pmid);
  else starredSet.add(pmid);
  try { localStorage.setItem(STAR_STORAGE_KEY, JSON.stringify([...starredSet])); } catch (e) { /* best effort */ }
  refresh();
}

function toggleStarredOnly() {
  onlyStarred = !onlyStarred;
  if (onlyStarred) { onlyFlagged = false; onlyEdited = false; }  // one bypass view at a time
  refresh();
}

function renderStarBanner() {
  const el = document.getElementById("star-banner");
  const count = starredSet.size;
  el.innerHTML = `<button class="star-banner-btn${onlyStarred ? " active" : ""}" onclick="toggleStarredOnly()">${onlyStarred ? "★" : "☆"} <span class="banner-long">Stjernede </span>(${count})<span class="banner-long">${onlyStarred ? " — vis alle" : ""}</span></button>`;
}
let activeTiers = new Set(TIERS);  // all on by default
let currentMonth = null;  // "YYYY-MM" of the digest run

// The tier filter applies everywhere, not just to the list: tab counts and the
// set of visible tabs follow it, so a count never promises hidden items.
function inTier(rec) { return activeTiers.has(rec.tier); }

// Journals post-date issues, so a record can be dated ahead of the run month.
// Those belong in the current month's section -- they arrived in this digest —
// rather than in a "future" section sorting above it.
function monthKey(date) {
  const key = date.slice(0, 7);
  return (currentMonth && key > currentMonth) ? currentMonth : key;
}

// Month key n months before `key`, e.g. monthsBack("2026-08", 5) -> "2026-03".
function monthsBack(key, n) {
  const [year, month] = key.split("-").map(Number);
  const d = new Date(year, month - 1 - n, 1);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}

function monthLabel(key) {
  const [year, month] = key.split("-");
  const name = MONTHS_DA[parseInt(month, 10) - 1];
  return name.charAt(0).toUpperCase() + name.slice(1) + " " + year;
}

// A record can be cross-listed under two groups. Older records carry a single
// disease_group string instead of the disease_groups list.
function groupsOf(rec) {
  return rec.disease_groups || (rec.disease_group ? [rec.disease_group] : []);
}

// "Alle" matches everything; a cross-listed record still appears only once
// there, since this filters on the record, not on its groups.
function inDisease(rec) {
  return activeDisease === ALL_GROUP || groupsOf(rec).includes(activeDisease);
}

function inEvidence(rec) {
  return activeEvidence === ALL_EVIDENCE || rec.evidence_type === activeEvidence;
}

function passesFlagFilter(rec) {
  return !onlyFlagged || !!rec.flagged;
}

function toggleFlaggedOnly() {
  onlyFlagged = !onlyFlagged;
  if (onlyFlagged) { onlyStarred = false; onlyEdited = false; }  // one bypass view at a time
  activeDisease = ALL_GROUP;
  activeEvidence = ALL_EVIDENCE;
  refresh();
}

function renderFlagBanner() {
  const count = library.filter(r => r.flagged).length;
  const el = document.getElementById("flag-banner");
  if (count === 0) {
    el.innerHTML = "";
    return;
  }
  el.innerHTML = `<button class="flag-banner-btn${onlyFlagged ? " active" : ""}" onclick="toggleFlaggedOnly()">⚑ ${count}<span class="banner-long"> til gennemsyn${onlyFlagged ? " — vis alle" : ""}</span></button>`;
}

// Third bypass view, alongside "Stjernede" and "til gennemsyn": everything
// edited since you last looked. Unlike those two it can surface hidden
// records, which is the point -- an article a colleague removed is otherwise
// nowhere to be found.
function toggleEditedOnly() {
  if (!isOwner()) return;
  onlyEdited = !onlyEdited;
  if (onlyEdited) { onlyStarred = false; onlyFlagged = false; }
  activeDisease = ALL_GROUP;
  activeEvidence = ALL_EVIDENCE;
  refresh();
}

function renderEditBanner() {
  const el = document.getElementById("edit-banner");
  if (!el) return;
  // The review queue is the owner's alone. Everyone else can edit freely --
  // including acting on flagged articles -- they just don't carry the job of
  // reviewing what everyone else did.
  if (!isOwner()) { el.innerHTML = ""; return; }
  const count = editedRecords().length;
  if (count === 0) { el.innerHTML = ""; return; }
  el.innerHTML = `<button class="edit-banner-btn${onlyEdited ? " active" : ""}" onclick="toggleEditedOnly()">✎ ${count}<span class="banner-long"> rettet${onlyEdited ? " — vis alle" : ""}</span></button>`;
}

function authorLine(rec) {
  if (rec.first_author === rec.last_author) return rec.first_author;
  return `${rec.first_author}...${rec.last_author}`;
}

function renderCorrectionBody(rec) {
  const currentGroups = groupsOf(rec);
  const groupChecks = DISEASE_ORDER.map(g => `
    <label class="correction-chip">
      <input type="checkbox" id="grp-${rec.pmid}-${g}" ${currentGroups.includes(g) ? "checked" : ""}>${DISEASE_LABEL[g]}
    </label>`).join("");
  const evidenceOptions = EVIDENCE_ORDER.map(t =>
    `<option value="${t}" ${t === rec.evidence_type ? "selected" : ""}>${EVIDENCE_LABEL[t]}</option>`).join("");
  const dismissRow = rec.flagged
    ? `<label class="correction-check"><input type="checkbox" id="dismiss-${rec.pmid}"> Afvis flag (ingen ændring nødvendig)</label>`
    : "";
  return `
    <div class="correction-body">
      <div class="correction-field">
        <span class="correction-label">Sygdomsgruppe(r)</span>
        <div class="correction-checks">${groupChecks}</div>
      </div>
      <div class="correction-field">
        <span class="correction-label">Evidenstype</span>
        <select id="ev-${rec.pmid}">${evidenceOptions}</select>
      </div>
      <label class="correction-check"><input type="checkbox" id="excl-${rec.pmid}"> Ekskludér denne artikel helt</label>
      ${dismissRow}
      <button type="button" class="correction-submit" onclick="proposeCorrection('${rec.pmid}')">Gem rettelse</button>
    </div>`;
}

// Writes the edit to Firestore. No sign-in involved: anyone reading the site
// can correct it, which is the point. The edit goes live immediately but
// lands unacknowledged, so it shows up on the card and in the owner's
// "✎ N rettet" queue until reviewed. The owner's own edits need no such
// review, so they're acknowledged as they're written.
//
// `by` is empty for everyone but the owner -- without an account there is no
// identity to record. The queue shows that something changed and when, not
// who did it.
async function applyOverride(pmid, patch) {
  if (!FIREBASE_AVAILABLE) return;
  try {
    const stamped = {
      ...patch,
      updated_at: firebase.firestore.FieldValue.serverTimestamp(),
      by: emailOf(currentUser),
      acknowledged: isOwner(),
    };
    await db.collection("overrides").doc(pmid).set(stamped, { merge: true });
    // Mirror it locally so the card updates now rather than on next load.
    // serverTimestamp() resolves server-side, so stand in with the local
    // clock for display until the next fetch brings the real value.
    overridesMap.set(pmid, {
      ...(overridesMap.get(pmid) || {}), ...stamped, updated_at: new Date().toISOString(),
    });
    applyOverrides(rawLibrary);
    refresh();
  } catch (err) {
    console.error("Kunne ikke gemme rettelsen", err);
    alert("Rettelsen kunne ikke gemmes. Du har muligvis ikke adgang til at rette.");
  }
}

// One-click shortcut for the common case: the flag was a false alarm, dismiss
// it with no other change -- so the flagged-only view (the badge) is
// somewhere you can actually clear items from, not just look at them.
function acceptFlag(pmid) {
  applyOverride(pmid, { dismissed_flag: true });
}

// Owner-only, both of them: the two ways to close out someone else's edit.
// "Kvittér" says you've seen it and agree -- the record keeps the change and
// drops off the badge. "Fortryd" deletes the override outright, at which
// point the record falls back to whatever library.json says, which is
// untouched by any of this and versioned in git.
async function acknowledgeEdit(pmid) {
  if (!FIREBASE_AVAILABLE || !isOwner()) return;
  try {
    await db.collection("overrides").doc(pmid).set({ acknowledged: true }, { merge: true });
    overridesMap.set(pmid, { ...(overridesMap.get(pmid) || {}), acknowledged: true });
    applyOverrides(rawLibrary);
    refresh();
  } catch (err) {
    console.error("Kunne ikke kvittere for rettelsen", err);
    alert("Kunne ikke kvittere for rettelsen.");
  }
}

async function revertEdit(pmid) {
  if (!FIREBASE_AVAILABLE || !isOwner()) return;
  if (!confirm("Fortryd denne rettelse? Artiklen vender tilbage til sin oprindelige klassifikation.")) return;
  try {
    await db.collection("overrides").doc(pmid).delete();
    overridesMap.delete(pmid);
    applyOverrides(rawLibrary);
    refresh();
  } catch (err) {
    console.error("Kunne ikke fortryde rettelsen", err);
    alert("Kunne ikke fortryde rettelsen.");
  }
}

// The other half of reviewing a flagged card: the flag was right, this
// doesn't belong in the library. Confirmed first -- it sits one tap from
// "Godkend" and does the opposite, so a mis-tap shouldn't quietly drop an
// article.
function deleteRecord(pmid) {
  const rec = library.find(r => r.pmid === pmid);
  if (!confirm(`Slet denne artikel fra biblioteket?\n\n${rec.title}`)) return;
  applyOverride(pmid, { hidden: true });
}

function proposeCorrection(pmid) {
  const rec = library.find(r => r.pmid === pmid);
  const currentGroups = groupsOf(rec);
  const selectedGroups = DISEASE_ORDER.filter(g => document.getElementById(`grp-${pmid}-${g}`).checked);
  const selectedEvidence = document.getElementById(`ev-${pmid}`).value;
  const exclude = document.getElementById(`excl-${pmid}`).checked;
  const dismissEl = document.getElementById(`dismiss-${pmid}`);
  const dismiss = dismissEl ? dismissEl.checked : false;

  const groupsChanged = JSON.stringify([...currentGroups].sort()) !== JSON.stringify([...selectedGroups].sort());
  const evidenceChanged = selectedEvidence !== rec.evidence_type;

  if (!exclude && !dismiss && !groupsChanged && !evidenceChanged) {
    alert("Ingen ændring valgt.");
    return;
  }

  const patch = {};
  if (exclude) {
    patch.hidden = true;
  } else {
    if (groupsChanged) patch.disease_groups = selectedGroups;
    if (evidenceChanged) patch.evidence_type = selectedEvidence;
    if (dismiss) patch.dismissed_flag = true;
  }

  applyOverride(pmid, patch);
}

function renderItem(rec) {
  const sections = rec.abstract_sections.map(s =>
    s.label ? `<p><strong>${s.label}:</strong> ${s.text}</p>` : `<p>${s.text}</p>`
  ).join("");
  const chips = `<div class="chip-row">`
    + `<span class="evidence-chip">${EVIDENCE_BADGE[rec.evidence_type] || rec.evidence_type}</span>`
    + groupsOf(rec).map(g => `<span class="disease-chip">${DISEASE_LABEL[g]}</span>`).join("")
    + (rec.keywords || []).map(k => `<span class="keyword-chip">${k}</span>`).join("")
    + `</div>`;
  // Set only when AI's weekly read flagged something a deterministic filter
  // didn't catch (see ROUTINE.md) -- surfaced right on the card, not buried
  // in a run log only visible during the unattended weekly run.
  // The actions only exist if there's somewhere for them to write. With no
  // fallback path behind them any more, drawing them when Firestore is
  // unreachable would just be buttons that quietly do nothing.
  const flag = rec.flagged
    ? `<p class="flag-note"><span>⚑ ${rec.flagged}</span>
        ${FIREBASE_AVAILABLE ? `<span class="flag-actions">
          <button type="button" class="accept-flag-btn" onclick="acceptFlag('${rec.pmid}')">✓ Godkend</button>
          <button type="button" class="delete-flag-btn" onclick="deleteRecord('${rec.pmid}')">🗑 Slet</button>
        </span>` : ""}
      </p>`
    : "";
  // An edit announces itself rather than sitting there looking normal --
  // that's what makes going live without review safe enough. Only the owner
  // gets the two closing actions; for everyone else it's just a note.
  const ov = rec.__ov;
  const edit = (ov && !ov.acknowledged)
    ? `<p class="edit-note"><span>✎ ${ov.hidden ? "skjult" : "rettet"}${overrideDate(ov) ? " " + overrideDate(ov) : ""}${ov.by ? " af " + ov.by : ""}</span>
        ${isOwner() ? `<span class="edit-actions">
          <button type="button" class="ack-edit-btn" onclick="acknowledgeEdit('${rec.pmid}')">✓ Kvittér</button>
          <button type="button" class="revert-edit-btn" onclick="revertEdit('${rec.pmid}')">↩ Fortryd</button>
        </span>` : ""}
      </p>`
    : "";
  const starred = isStarred(rec);
  return `
    <div class="item">
      <button type="button" class="star-btn${starred ? " starred" : ""}"
        onclick="toggleStar('${rec.pmid}')" aria-label="${starred ? "Fjern stjerne" : "Stjern artikel"}"
        aria-pressed="${starred}">${starred ? "★" : "☆"}</button>
      <p class="title">${rec.title}</p>
      <p class="meta">${authorLine(rec)} · <span class="journal">${rec.journal}</span> · ${rec.date} · <a href="https://pubmed.ncbi.nlm.nih.gov/${rec.pmid}/" target="_blank">PMID ${rec.pmid}</a> <span class="tier-badge t${rec.tier}">${TIER_LABEL[rec.tier]}</span></p>
      ${edit}
      ${flag}
      ${chips}
      <div class="toggle-row">
        <details class="abstract-toggle">
          <summary>Abstract</summary>
          <div class="abstract-full">${sections}</div>
        </details>
        ${FIREBASE_AVAILABLE ? `<details class="correction-toggle">
          <summary>Rettelse</summary>
          ${renderCorrectionBody(rec)}
        </details>` : ""}
      </div>
    </div>`;
}

// Shared by the normal filtered view and the "Stjernede" bypass view: one
// collapsible section per calendar month, newest first (`library` is already
// sorted newest-first, so each month keeps that order).
function renderGroupedItems(items, emptyMessage) {
  const panel = document.getElementById("panel");
  if (items.length === 0) {
    panel.innerHTML = `<p class="empty-note">${emptyMessage}</p>`;
    return;
  }

  const byMonth = new Map();
  items.forEach(rec => {
    const key = monthKey(rec.date);
    if (!byMonth.has(key)) byMonth.set(key, []);
    byMonth.get(key).push(rec);
  });

  // Expanded by default: every month within the last six of the run month.
  // The `i === 0` clause keeps the topmost section open in a sparse combo whose
  // newest items are already older than that window.
  const openFrom = currentMonth ? monthsBack(currentMonth, 5) : null;

  const months = [...byMonth.keys()].sort().reverse();
  panel.innerHTML = months.map((key, i) => {
    const monthItems = byMonth.get(key);
    // Only the run month earns the generic label -- in a sparse group the top
    // section can be months old, and calling that "Seneste måned" would misread.
    const label = key === currentMonth ? "Seneste måned" : monthLabel(key);
    const openAttr = (i === 0 || (openFrom && key >= openFrom)) ? " open" : "";
    return `
      <details${openAttr} class="time-bucket">
        <summary>${label} (${monthItems.length})</summary>
        <div class="bucket-items">${monthItems.map(renderItem).join("")}</div>
      </details>`;
  }).join("");
}

function renderPanel() {
  if (onlyEdited) {
    renderGroupedItems(editedRecords(), "Ingen rettelser at se på.");
    return;
  }

  if (onlyStarred) {
    renderGroupedItems(library.filter(isStarred), "Ingen stjernede artikler endnu.");
    return;
  }

  if (activeTiers.size === 0) {
    document.getElementById("panel").innerHTML = `<p class="empty-note">Vælg mindst én tidsskrifttype.</p>`;
    return;
  }

  const items = library.filter(r => inTier(r) && inDisease(r) && inEvidence(r) && passesFlagFilter(r));
  renderGroupedItems(items, onlyFlagged ? "Ingen flagede poster her." : "Ingen nye.");
}

// Single redraw path: recompute which disease tabs still have hits under the
// current evidence type and tier selection, keep the active one if it survived,
// then repaint everything. "Stjernede" is a full bypass -- it ignores every
// other filter by design (the user asked to see starred articles "uden de
// andre filtre gælder"), so the tab/tier rows that don't apply are hidden
// rather than shown disabled or stale.
function refresh() {
  // Signing out of the owner account while the review view is open would
  // otherwise leave someone stuck in a view they can no longer leave --
  // the badge that toggles it is gone by then.
  if (onlyEdited && !isOwner()) onlyEdited = false;
  renderStarBanner();
  // Both bypass views ignore every other filter, so the rows that no longer
  // apply come down rather than sitting there stale.
  if (onlyStarred || onlyEdited) {
    document.getElementById("evidence-tabs").innerHTML = "";
    document.getElementById("disease-tabs").innerHTML = "";
    document.getElementById("tier-filter").innerHTML = "";
    renderFlagBanner();
    renderEditBanner();
    renderPanel();
    return;
  }

  const groups = DISEASE_ORDER.filter(g =>
    library.some(r => inTier(r) && inEvidence(r) && passesFlagFilter(r) && groupsOf(r).includes(g)));
  if (groups.length > 0) groups.unshift(ALL_GROUP);  // always first, the default
  if (!groups.includes(activeDisease)) {
    activeDisease = groups[0] || activeDisease;
  }
  renderEvidenceTabs();
  renderDiseaseTabs(groups);
  renderTierFilter();
  renderFlagBanner();
  renderEditBanner();
  renderPanel();
}

function selectEvidence(type) {
  activeEvidence = type;
  refresh();
}

function selectDisease(group) {
  activeDisease = group;
  refresh();
}

function toggleTier(tier) {
  if (activeTiers.has(tier)) activeTiers.delete(tier);
  else activeTiers.add(tier);
  refresh();
}

function renderTierFilter() {
  const el = document.getElementById("tier-filter");
  el.innerHTML = `<span class="tier-filter-label">Tidsskrifttype</span>` + TIERS.map(tier => {
    const on = activeTiers.has(tier);
    const count = library.filter(r => r.tier === tier && inEvidence(r)).length;
    return `<label class="tier-chip t${tier}${on ? " on" : ""}">
      <input type="checkbox" ${on ? "checked" : ""} onchange="toggleTier(${tier})">${TIER_LABEL[tier]}
      <span class="tier-chip-count">${count}</span>
    </label>`;
  }).join("");
}

function renderEvidenceTabs() {
  const el = document.getElementById("evidence-tabs");
  el.innerHTML = [ALL_EVIDENCE, ...EVIDENCE_ORDER].map(type => {
    const count = library.filter(r =>
      inTier(r) && passesFlagFilter(r) && (type === ALL_EVIDENCE || r.evidence_type === type)).length;
    const active = type === activeEvidence ? "active" : "";
    return `<div class="tab-item ${active}" onclick="selectEvidence('${type}')"><span>${EVIDENCE_LABEL[type]}</span><span class="count">${count}</span></div>`;
  }).join("");
}

// Rendered twice over, with CSS picking one: as a tab row on a wide screen,
// and as a dropdown on a narrow one, where the row wraps to three lines and
// eats 158px of a ~700px viewport. Keeping both in the DOM means a resize
// (or a phone rotating) needs no re-render.
function renderDiseaseTabs(diseaseGroups) {
  const el = document.getElementById("disease-tabs");
  if (diseaseGroups.length === 0) {
    el.innerHTML = "";
    return;
  }
  const options = diseaseGroups.map(group =>
    `<option value="${group}"${group === activeDisease ? " selected" : ""}>${DISEASE_LABEL[group]}</option>`
  ).join("");
  const tabs = diseaseGroups.map(group => {
    const active = group === activeDisease ? "active" : "";
    return `<div class="etab ${active}" onclick="selectDisease('${group}')">${DISEASE_LABEL[group]}</div>`;
  }).join("");
  el.innerHTML =
    `<select class="disease-select" aria-label="Sygdomsgruppe" onchange="selectDisease(this.value)">${options}</select>`
    + tabs;
}

// The sticky rows below the header need to know how tall it is, and that
// isn't a constant: it's 65px wide, 90px on a phone, and grows again when
// the sign-in button swaps its label for an account name. Measuring it beats
// hardcoding a number that silently goes stale. Same for the evidence rail,
// which the disease row stacks under once they're side by side no longer.
function syncStickyOffsets() {
  const root = document.documentElement;
  const header = document.querySelector(".site-header");
  const rail = document.getElementById("evidence-tabs");
  if (header) root.style.setProperty("--header-h", header.offsetHeight + "px");
  if (rail) root.style.setProperty("--rail-h", rail.offsetHeight + "px");
}

renderAuthBanner();
syncStickyOffsets();
// Both boxes change height on their own: the header when the sign-in label
// or the banners change, the rail when the evidence tabs reflow.
[".site-header", "#evidence-tabs"].forEach(sel => {
  const el = document.querySelector(sel);
  if (el && window.ResizeObserver) new ResizeObserver(syncStickyOffsets).observe(el);
});

Promise.all([
  fetch("data/library.json?t=" + Date.now(), {cache: "no-store"}).then(r => r.json()),
  loadOverrides()
])
  .then(([data]) => {
    // Accepts both the current {generated_at, records} shape and the older
    // bare-array files.
    rawLibrary = Array.isArray(data) ? data : data.records;
    applyOverrides(rawLibrary);
    const generatedAt = Array.isArray(data) ? null : data.generated_at;
    if (generatedAt) {
      document.getElementById("updated-date").textContent = "Sidst opdateret: " + generatedAt;
    }
    // Set before any rendering: monthKey() folds post-dated records into it.
    currentMonth = (generatedAt || new Date().toISOString()).slice(0, 7);
    activeDisease = ALL_GROUP;
    selectEvidence(ALL_EVIDENCE);
  })
  .catch(err => {
    document.getElementById("panel").innerHTML = `<p class="empty-note">Kunne ikke indlæse data.</p>`;
    console.error(err);
  });
</script>
</body>
</html>
