<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reuma-evidens</title>
<!-- Bump ?v= when the stylesheet changes: GitHub Pages caches assets, so
     without it a deploy can leave visitors on the previous CSS. -->
<link rel="stylesheet" href="assets/style.css?v=16">
</head>
<body class="salix">
<header class="site-header">
  <div class="brand">
    <span class="wordmark">Reuma-<em>evidens</em></span>
  </div>
  <span class="header-right">
    <span id="star-banner"></span>
    <span id="flag-banner"></span>
    <span id="updated-date"></span>
  </span>
</header>

<div id="app">
  <div id="evidence-tabs" class="tabs-col"></div>
  <div id="viewer">
    <div id="disease-tabs" class="tabs-row"></div>
    <div id="tier-filter" class="tier-filter"></div>
    <div id="panel"></div>
  </div>
</div>

<footer class="site-footer">Genereret automatisk fra PubMed. Opdateres ugentligt.</footer>

<script>
// Display order only. Classification precedence is DISEASE_PATTERNS in
// update_library.py and is deliberately different — don't sync the two.
const DISEASE_ORDER = ["RA","PsA/SpA","PMR/GCA","Crystal","General","SLE","IIM","Vasculitis","Sjögren","SSc","Autoinflammatory"];
// A viewer-only pseudo-group shown first and selected by default: never a
// stored label, so it stays out of DISEASE_ORDER and out of the digests.
const ALL_GROUP = "__all__";
const DISEASE_LABEL = {
  "RA": "RA", "PsA/SpA": "PsA/SpA", "SLE": "SLE", "IIM": "IIM",
  "Vasculitis": "Vaskulitis", "PMR/GCA": "PMR og GCA", "Sjögren": "Sjögren", "SSc": "SSc",
  "Crystal": "Krystalartrit", "Autoinflammatory": "Autoinflammatorisk", "General": "Generelt",
  [ALL_GROUP]: "Alle"
};
const EVIDENCE_ORDER = ["RCT","Guideline/consensus","Evidence synthesis","Observational","Clinical case/survey"];
// Viewer-only, like ALL_GROUP: never a stored evidence_type.
const ALL_EVIDENCE = "__all_ev__";
const EVIDENCE_LABEL = {
  [ALL_EVIDENCE]: "Alt",
  "RCT": "RCT", "Guideline/consensus": "Retningslinje",
  "Evidence synthesis": "Meta/reviews", "Observational": "Observationelt",
  "Clinical case/survey": "Klinisk case/opgørelse"
};
const EVIDENCE_BADGE = {
  "RCT": "RCT", "Guideline/consensus": "Retningslinje",
  "Evidence synthesis": "Meta/review", "Observational": "Observationel",
  "Clinical case/survey": "Case"
};
const MONTHS_DA = ["januar","februar","marts","april","maj","juni",
                   "juli","august","september","oktober","november","december"];

const TIERS = [1, 2, 3, 4];
// What the tiers actually mean, in the reader's words. Stored as 1-4 so the
// data stays language-neutral; only the viewer names them.
const TIER_LABEL = {
  1: "Top medicin", 2: "Top reumatologi", 3: "Reumatologi", 4: "Øvrige"
};

let library = [];
let activeDisease = null;
let activeEvidence = null;
let onlyFlagged = false;

// Personal bookmarks, kept in this browser only -- there's no server to save
// them to (see the correction-form comment on why the site can't write back
// to GitHub itself). localStorage.getItem can throw in a locked-down context
// (private browsing in some browsers); starring is a nice-to-have, so fail
// quiet and just start empty rather than breaking the page over it.
const STAR_STORAGE_KEY = "reuma-evidens-starred";
let starredSet = new Set();
try {
  starredSet = new Set(JSON.parse(localStorage.getItem(STAR_STORAGE_KEY) || "[]"));
} catch (e) { /* starting empty is fine */ }
let onlyStarred = false;

function isStarred(rec) { return starredSet.has(rec.pmid); }

function toggleStar(pmid) {
  if (starredSet.has(pmid)) starredSet.delete(pmid);
  else starredSet.add(pmid);
  try { localStorage.setItem(STAR_STORAGE_KEY, JSON.stringify([...starredSet])); } catch (e) { /* best effort */ }
  refresh();
}

function toggleStarredOnly() {
  onlyStarred = !onlyStarred;
  if (onlyStarred) onlyFlagged = false;  // one bypass view at a time
  refresh();
}

function renderStarBanner() {
  const el = document.getElementById("star-banner");
  const count = starredSet.size;
  el.innerHTML = `<button class="star-banner-btn${onlyStarred ? " active" : ""}" onclick="toggleStarredOnly()">
    ${onlyStarred ? "★" : "☆"} Stjernede (${count})${onlyStarred ? " — vis alle" : ""}
  </button>`;
}
let activeTiers = new Set(TIERS);  // all on by default
let currentMonth = null;  // "YYYY-MM" of the digest run

// The tier filter applies everywhere, not just to the list: tab counts and the
// set of visible tabs follow it, so a count never promises hidden items.
function inTier(rec) { return activeTiers.has(rec.tier); }

// Journals post-date issues, so a record can be dated ahead of the run month.
// Those belong in the current month's section -- they arrived in this digest —
// rather than in a "future" section sorting above it.
function monthKey(date) {
  const key = date.slice(0, 7);
  return (currentMonth && key > currentMonth) ? currentMonth : key;
}

// Month key n months before `key`, e.g. monthsBack("2026-08", 5) -> "2026-03".
function monthsBack(key, n) {
  const [year, month] = key.split("-").map(Number);
  const d = new Date(year, month - 1 - n, 1);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}

function monthLabel(key) {
  const [year, month] = key.split("-");
  const name = MONTHS_DA[parseInt(month, 10) - 1];
  return name.charAt(0).toUpperCase() + name.slice(1) + " " + year;
}

// A record can be cross-listed under two groups. Older records carry a single
// disease_group string instead of the disease_groups list.
function groupsOf(rec) {
  return rec.disease_groups || (rec.disease_group ? [rec.disease_group] : []);
}

// "Alle" matches everything; a cross-listed record still appears only once
// there, since this filters on the record, not on its groups.
function inDisease(rec) {
  return activeDisease === ALL_GROUP || groupsOf(rec).includes(activeDisease);
}

function inEvidence(rec) {
  return activeEvidence === ALL_EVIDENCE || rec.evidence_type === activeEvidence;
}

function passesFlagFilter(rec) {
  return !onlyFlagged || !!rec.flagged;
}

function toggleFlaggedOnly() {
  onlyFlagged = !onlyFlagged;
  if (onlyFlagged) onlyStarred = false;  // one bypass view at a time
  activeDisease = ALL_GROUP;
  activeEvidence = ALL_EVIDENCE;
  refresh();
}

function renderFlagBanner() {
  const count = library.filter(r => r.flagged).length;
  const el = document.getElementById("flag-banner");
  if (count === 0) {
    el.innerHTML = "";
    return;
  }
  el.innerHTML = `<button class="flag-banner-btn${onlyFlagged ? " active" : ""}" onclick="toggleFlaggedOnly()">
    ⚑ ${count} til gennemsyn${onlyFlagged ? " — vis alle" : ""}
  </button>`;
}

function authorLine(rec) {
  if (rec.first_author === rec.last_author) return rec.first_author;
  return `${rec.first_author}...${rec.last_author}`;
}

// The site is static (GitHub Pages) and can't write to library.json itself --
// there's no server to receive the click. This builds a GitHub "new issue"
// link, pre-filled and labelled "rettelse", so the actual write still goes
// through a real GitHub action the user takes deliberately. The weekly
// routine picks up open "rettelse" issues, applies them, and closes them --
// see ROUTINE.md. A correction submitted this way lands at the *next*
// Monday run, not instantly.
const CORRECTION_REPO = "jesperlindhardsen/rheum-digest";

function renderCorrectionBody(rec) {
  const currentGroups = groupsOf(rec);
  const groupChecks = DISEASE_ORDER.map(g => `
    <label class="correction-chip">
      <input type="checkbox" id="grp-${rec.pmid}-${g}" ${currentGroups.includes(g) ? "checked" : ""}>${DISEASE_LABEL[g]}
    </label>`).join("");
  const evidenceOptions = EVIDENCE_ORDER.map(t =>
    `<option value="${t}" ${t === rec.evidence_type ? "selected" : ""}>${EVIDENCE_LABEL[t]}</option>`).join("");
  const dismissRow = rec.flagged
    ? `<label class="correction-check"><input type="checkbox" id="dismiss-${rec.pmid}"> Afvis flag (ingen ændring nødvendig)</label>`
    : "";
  return `
    <div class="correction-body">
      <div class="correction-field">
        <span class="correction-label">Sygdomsgruppe(r)</span>
        <div class="correction-checks">${groupChecks}</div>
      </div>
      <div class="correction-field">
        <span class="correction-label">Evidenstype</span>
        <select id="ev-${rec.pmid}">${evidenceOptions}</select>
      </div>
      <label class="correction-check"><input type="checkbox" id="excl-${rec.pmid}"> Ekskludér denne artikel helt</label>
      ${dismissRow}
      <button type="button" class="correction-submit" onclick="proposeCorrection('${rec.pmid}')">Opret rettelse på GitHub ↗</button>
    </div>`;
}

// One-click shortcut for the common case: the flag was a false alarm, dismiss
// it with no other change. Same GitHub-issue mechanism as the "Afvis flag"
// checkbox below, just without opening the full correction form first --
// so the flagged-only view (the badge) is somewhere you can actually clear
// items from, not just look at them.
function acceptFlag(pmid) {
  const rec = library.find(r => r.pmid === pmid);
  const lines = [
    `PMID: ${pmid}`,
    `Titel: ${rec.title}`,
    "",
    "Afvis eksisterende flag: Ja (ingen indholdsændring, fjern blot flaget)"
  ];
  const title = `Rettelse: PMID ${pmid}`;
  const url = `https://github.com/${CORRECTION_REPO}/issues/new`
    + `?title=${encodeURIComponent(title)}`
    + `&body=${encodeURIComponent(lines.join("\n"))}`
    + `&labels=rettelse`;
  window.open(url, "_blank");
}

function proposeCorrection(pmid) {
  const rec = library.find(r => r.pmid === pmid);
  const currentGroups = groupsOf(rec);
  const selectedGroups = DISEASE_ORDER.filter(g => document.getElementById(`grp-${pmid}-${g}`).checked);
  const selectedEvidence = document.getElementById(`ev-${pmid}`).value;
  const exclude = document.getElementById(`excl-${pmid}`).checked;
  const dismissEl = document.getElementById(`dismiss-${pmid}`);
  const dismiss = dismissEl ? dismissEl.checked : false;

  const groupsChanged = JSON.stringify([...currentGroups].sort()) !== JSON.stringify([...selectedGroups].sort());
  const evidenceChanged = selectedEvidence !== rec.evidence_type;

  if (!exclude && !dismiss && !groupsChanged && !evidenceChanged) {
    alert("Ingen ændring valgt.");
    return;
  }

  const lines = [`PMID: ${pmid}`, `Titel: ${rec.title}`, ""];
  if (exclude) {
    lines.push("Ekskludér artiklen: Ja");
  } else {
    if (groupsChanged) {
      lines.push(`Nuværende sygdomsgrupper: ${currentGroups.join(", ")}`);
      lines.push(`Foreslåede sygdomsgrupper: ${selectedGroups.join(", ") || "(ingen)"}`);
      lines.push("");
    }
    if (evidenceChanged) {
      lines.push(`Nuværende evidenstype: ${rec.evidence_type}`);
      lines.push(`Foreslået evidenstype: ${selectedEvidence}`);
      lines.push("");
    }
    if (dismiss) {
      lines.push("Afvis eksisterende flag: Ja (ingen indholdsændring, fjern blot flaget)");
    }
  }

  const title = `Rettelse: PMID ${pmid}`;
  const url = `https://github.com/${CORRECTION_REPO}/issues/new`
    + `?title=${encodeURIComponent(title)}`
    + `&body=${encodeURIComponent(lines.join("\n"))}`
    + `&labels=rettelse`;
  window.open(url, "_blank");
}

function renderItem(rec) {
  const sections = rec.abstract_sections.map(s =>
    s.label ? `<p><strong>${s.label}:</strong> ${s.text}</p>` : `<p>${s.text}</p>`
  ).join("");
  const chips = `<div class="chip-row">`
    + `<span class="evidence-chip">${EVIDENCE_BADGE[rec.evidence_type] || rec.evidence_type}</span>`
    + groupsOf(rec).map(g => `<span class="disease-chip">${DISEASE_LABEL[g]}</span>`).join("")
    + (rec.keywords || []).map(k => `<span class="keyword-chip">${k}</span>`).join("")
    + `</div>`;
  // Set only when AI's weekly read flagged something a deterministic filter
  // didn't catch (see ROUTINE.md) -- surfaced right on the card, not buried
  // in a run log only visible during the unattended weekly run.
  const flag = rec.flagged
    ? `<p class="flag-note"><span>⚑ ${rec.flagged}</span>
        <button type="button" class="accept-flag-btn" onclick="acceptFlag('${rec.pmid}')">✓ Godkend</button>
      </p>`
    : "";
  const starred = isStarred(rec);
  return `
    <div class="item">
      <button type="button" class="star-btn${starred ? " starred" : ""}"
        onclick="toggleStar('${rec.pmid}')" aria-label="${starred ? "Fjern stjerne" : "Stjern artikel"}"
        aria-pressed="${starred}">${starred ? "★" : "☆"}</button>
      <p class="title">${rec.title}</p>
      <p class="meta">${authorLine(rec)} · <span class="journal">${rec.journal}</span> · ${rec.date} · <a href="https://pubmed.ncbi.nlm.nih.gov/${rec.pmid}/" target="_blank">PMID ${rec.pmid}</a> <span class="tier-badge t${rec.tier}">${TIER_LABEL[rec.tier]}</span></p>
      ${flag}
      ${chips}
      <div class="toggle-row">
        <details class="abstract-toggle">
          <summary>Vis abstract</summary>
          <div class="abstract-full">${sections}</div>
        </details>
        <details class="correction-toggle">
          <summary>Fejlkategoriseret?</summary>
          ${renderCorrectionBody(rec)}
        </details>
      </div>
    </div>`;
}

// Shared by the normal filtered view and the "Stjernede" bypass view: one
// collapsible section per calendar month, newest first (`library` is already
// sorted newest-first, so each month keeps that order).
function renderGroupedItems(items, emptyMessage) {
  const panel = document.getElementById("panel");
  if (items.length === 0) {
    panel.innerHTML = `<p class="empty-note">${emptyMessage}</p>`;
    return;
  }

  const byMonth = new Map();
  items.forEach(rec => {
    const key = monthKey(rec.date);
    if (!byMonth.has(key)) byMonth.set(key, []);
    byMonth.get(key).push(rec);
  });

  // Expanded by default: every month within the last six of the run month.
  // The `i === 0` clause keeps the topmost section open in a sparse combo whose
  // newest items are already older than that window.
  const openFrom = currentMonth ? monthsBack(currentMonth, 5) : null;

  const months = [...byMonth.keys()].sort().reverse();
  panel.innerHTML = months.map((key, i) => {
    const monthItems = byMonth.get(key);
    // Only the run month earns the generic label -- in a sparse group the top
    // section can be months old, and calling that "Seneste måned" would misread.
    const label = key === currentMonth ? "Seneste måned" : monthLabel(key);
    const openAttr = (i === 0 || (openFrom && key >= openFrom)) ? " open" : "";
    return `
      <details${openAttr} class="time-bucket">
        <summary>${label} (${monthItems.length})</summary>
        <div class="bucket-items">${monthItems.map(renderItem).join("")}</div>
      </details>`;
  }).join("");
}

function renderPanel() {
  if (onlyStarred) {
    renderGroupedItems(library.filter(isStarred), "Ingen stjernede artikler endnu.");
    return;
  }

  if (activeTiers.size === 0) {
    document.getElementById("panel").innerHTML = `<p class="empty-note">Vælg mindst én tidsskrifttype.</p>`;
    return;
  }

  const items = library.filter(r => inTier(r) && inDisease(r) && inEvidence(r) && passesFlagFilter(r));
  renderGroupedItems(items, onlyFlagged ? "Ingen flagede poster her." : "Ingen nye.");
}

// Single redraw path: recompute which disease tabs still have hits under the
// current evidence type and tier selection, keep the active one if it survived,
// then repaint everything. "Stjernede" is a full bypass -- it ignores every
// other filter by design (the user asked to see starred articles "uden de
// andre filtre gælder"), so the tab/tier rows that don't apply are hidden
// rather than shown disabled or stale.
function refresh() {
  renderStarBanner();
  if (onlyStarred) {
    document.getElementById("evidence-tabs").innerHTML = "";
    document.getElementById("disease-tabs").innerHTML = "";
    document.getElementById("tier-filter").innerHTML = "";
    renderFlagBanner();
    renderPanel();
    return;
  }

  const groups = DISEASE_ORDER.filter(g =>
    library.some(r => inTier(r) && inEvidence(r) && passesFlagFilter(r) && groupsOf(r).includes(g)));
  if (groups.length > 0) groups.unshift(ALL_GROUP);  // always first, the default
  if (!groups.includes(activeDisease)) {
    activeDisease = groups[0] || activeDisease;
  }
  renderEvidenceTabs();
  renderDiseaseTabs(groups);
  renderTierFilter();
  renderFlagBanner();
  renderPanel();
}

function selectEvidence(type) {
  activeEvidence = type;
  refresh();
}

function selectDisease(group) {
  activeDisease = group;
  refresh();
}

function toggleTier(tier) {
  if (activeTiers.has(tier)) activeTiers.delete(tier);
  else activeTiers.add(tier);
  refresh();
}

function renderTierFilter() {
  const el = document.getElementById("tier-filter");
  el.innerHTML = `<span class="tier-filter-label">Tidsskrifttype</span>` + TIERS.map(tier => {
    const on = activeTiers.has(tier);
    const count = library.filter(r => r.tier === tier && inEvidence(r)).length;
    return `<label class="tier-chip t${tier}${on ? " on" : ""}">
      <input type="checkbox" ${on ? "checked" : ""} onchange="toggleTier(${tier})">${TIER_LABEL[tier]}
      <span class="tier-chip-count">${count}</span>
    </label>`;
  }).join("");
}

function renderEvidenceTabs() {
  const el = document.getElementById("evidence-tabs");
  el.innerHTML = [ALL_EVIDENCE, ...EVIDENCE_ORDER].map(type => {
    const count = library.filter(r =>
      inTier(r) && passesFlagFilter(r) && (type === ALL_EVIDENCE || r.evidence_type === type)).length;
    const active = type === activeEvidence ? "active" : "";
    return `<div class="tab-item ${active}" onclick="selectEvidence('${type}')"><span>${EVIDENCE_LABEL[type]}</span><span class="count">${count}</span></div>`;
  }).join("");
}

function renderDiseaseTabs(diseaseGroups) {
  const el = document.getElementById("disease-tabs");
  if (diseaseGroups.length === 0) {
    el.innerHTML = "";
    return;
  }
  el.innerHTML = diseaseGroups.map(group => {
    const active = group === activeDisease ? "active" : "";
    return `<div class="etab ${active}" onclick="selectDisease('${group}')">${DISEASE_LABEL[group]}</div>`;
  }).join("");
}

fetch("data/library.json?t=" + Date.now(), {cache: "no-store"})
  .then(r => r.json())
  .then(data => {
    // Accepts both the current {generated_at, records} shape and the older
    // bare-array files.
    library = Array.isArray(data) ? data : data.records;
    const generatedAt = Array.isArray(data) ? null : data.generated_at;
    if (generatedAt) {
      document.getElementById("updated-date").textContent = "Sidst opdateret: " + generatedAt;
    }
    // Set before any rendering: monthKey() folds post-dated records into it.
    currentMonth = (generatedAt || new Date().toISOString()).slice(0, 7);
    activeDisease = ALL_GROUP;
    selectEvidence(ALL_EVIDENCE);
  })
  .catch(err => {
    document.getElementById("panel").innerHTML = `<p class="empty-note">Kunne ikke indlæse data.</p>`;
    console.error(err);
  });
</script>
</body>
</html>
